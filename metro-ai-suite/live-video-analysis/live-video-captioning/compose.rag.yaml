name: ${PROJECT_NAME:-live-video-caption}

x-nginx-common: &nginx-common
  image: nginxinc/nginx-unprivileged:1.29.2
  container_name: chatqna-core-nginx
  ports:
    - "8102:8102"
  volumes:
    - ./nginx_config/nginx.conf:/etc/nginx/nginx.conf:ro
  networks:
    - app_network

x-chatqna-core-common: &chatqna-core-common
  image: ${REGISTRY:-}chatqna:${BACKEND_TAG:-latest}
  environment:
    http_proxy: ${http_proxy}
    https_proxy: ${https_proxy}
    no_proxy: ${no_proxy},mediamtx,coturn,dlstreamer-pipeline-server,video-caption-service,collector,mqtt-broker,vdms-vector-db,multimodal-embedding-serving
    HF_ACCESS_TOKEN: ${HF_ACCESS_TOKEN}
    USE_VDMS: ${USE_VDMS:-false}
    VDMS_HOST: ${VDMS_HOST:-vdms-vector-db}
    VDMS_PORT: ${VDMS_PORT:-5555}
    VDMS_EMBEDDING_MODEL: ${VDMS_EMBEDDING_MODEL:-}
    VDMS_EMBEDDING_HOST: ${VDMS_EMBEDDING_HOST:-multimodal-embedding-serving}
    VDMS_EMBEDDING_HOST_PORT: ${VDMS_EMBEDDING_HOST_PORT:-8000}
  ports:
    - "8888:8888"
  volumes:
    - "${MODEL_CACHE_PATH}:/tmp/model_cache"
    - "${MODEL_CONFIG_PATH:-/dev/null}:/tmp/model_config/config.yaml"
  networks:
    - app_network
  group_add:
    - ${USER_GROUP_ID-1000}

services:
  nginx-default:
    <<: *nginx-common
    depends_on:
      - chatqna-core-ov-cpu
      - chatqna-core-ui

  chatqna-core-ov-cpu:
    <<: *chatqna-core-common
    container_name: chatqna-core-ov-cpu

  chatqna-core-ui:
    image: ${REGISTRY:-}chatqna-ui:${UI_TAG:-latest}
    container_name: chatqna-core-ui
    environment:
      http_proxy: ${http_proxy}
      https_proxy: ${https_proxy}
      no_proxy: ${no_proxy},mediamtx,coturn,dlstreamer-pipeline-server,video-caption-service,collector,mqtt-broker,vdms-vector-db,multimodal-embedding-serving
      APP_BACKEND_URL: ${APP_BACKEND_URL}
    ports:
      - "5173:8102"
    networks:
      - app_network

  multimodal-embedding-serving:
    image: intel/multimodal-embedding-serving:1.3.4-rc1
    container_name: multimodal-embedding-serving
    ports:
      - '${EMBEDDING_SERVER_PORT:-9777}:8000'
    ipc: host
    environment:
      no_proxy: localhost,127.0.0.1,mediamtx,coturn,dlstreamer-pipeline-server,video-caption-service,collector,mqtt-broker,vdms-vector-db,multimodal-embedding-serving,${no_proxy}
      no_proxy_env: localhost,127.0.0.1,mediamtx,coturn,dlstreamer-pipeline-server,video-caption-service,collector,mqtt-broker,vdms-vector-db,multimodal-embedding-serving,${no_proxy}
      http_proxy: ${http_proxy}
      https_proxy: ${https_proxy}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME}
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE}
      EMBEDDING_USE_OV: ${EMBEDDING_USE_OV}
      EMBEDDING_OV_MODELS_DIR: ${EMBEDDING_OV_MODELS_DIR:-/app/ov_models}
      DEFAULT_START_OFFSET_SEC: ${DEFAULT_START_OFFSET_SEC:-0}
      DEFAULT_CLIP_DURATION: ${DEFAULT_CLIP_DURATION:--1}
      DEFAULT_NUM_FRAMES: ${DEFAULT_NUM_FRAMES:-64}
      OV_PERFORMANCE_MODE: ${OV_PERFORMANCE_MODE:-LATENCY}
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - ${USER_GROUP_ID:-1000}
      - ${VIDEO_GROUP_ID:-44}
      - ${RENDER_GROUP_ID:-1002}
    restart: unless-stopped
    healthcheck:
      test: [ 'CMD-SHELL', 'curl -f http://localhost:8000/health || exit 1' ]
      interval: 10s
      timeout: 10s
      retries: 40
      start_period: 5s
    networks:
      - app_network
    volumes:
      - ov-models:/home/appuser/.cache/huggingface
      #- data-prep:/tmp/dataprep
      - ov-models:${EMBEDDING_OV_MODELS_DIR:-/app/ov_models}

  vdms-vector-db:
    image: intellabs/vdms:v2.11.0
    container_name: vdms-vector-db
    ipc: host
    environment:
      - no_proxy=localhost,127.0.0.1,mediamtx,coturn,dlstreamer-pipeline-server,video-caption-service,collector,mqtt-broker,vdms-vector-db,multimodal-embedding-serving,${no_proxy}
      - no_proxy_env=localhost,127.0.0.1,mediamtx,coturn,dlstreamer-pipeline-server,video-caption-service,collector,mqtt-broker,vdms-vector-db,multimodal-embedding-serving,${no_proxy}
      - http_proxy=${http_proxy}
      - https_proxy=${https_proxy}
      - OVERRIDE_db_root_path=/db
      - OVERRIDE_images_path=/db/images
      - OVERRIDE_descriptors_path=/db/descriptors
      - OVERRIDE_blobs_path=/db/blobs
      - OVERRIDE_pmgd_path=/db/graph
    ports:
      - '${VDMS_VDB_HOST_PORT}:55555'
    volumes:
      - vdms-db:/db
    networks:
      - app_network

volumes:
  ov-models:
    driver: local
  vdms-db:
    driver: local
