[project]
name = "real-time-scene-understanding"
version = "0.1.0"
description = "Real-time RTSP scene understanding with VLM alert detection and temporal deep analysis over segmented frame collections."
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi==0.128.0",
    "uvicorn[standard]==0.40.0",

    # RTSP ingestion + remux to MediaMTX (PyAV bundles ffmpeg libraries)
    "av==18.1.0",

    # VLM inference on decoded frames
    "openvino-genai==2026.2.1.0",
    "numpy>=2.0,<3.0",

    # SeaweedFS object storage (S3-compatible)
    "boto3>=1.40,<2.0",
]

[tool.uv]
package = false
