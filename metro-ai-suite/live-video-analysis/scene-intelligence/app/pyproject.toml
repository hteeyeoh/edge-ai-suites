[project]
name = "scene-intelligence"
version = "0.1.0"
description = "Scene Intelligence — RTSP ingestion and WebRTC rendering pipeline powered by PyAV"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi==0.128.0",
    "uvicorn[standard]==0.40.0",

    # RTSP ingestion + remux to MediaMTX (PyAV bundles ffmpeg libraries)
    "av==14.2.0",
]

[tool.uv]
package = false
